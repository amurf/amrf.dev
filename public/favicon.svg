<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --accent: #675796;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #B0B3D6;
      }
    }
    .geom-char {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <!-- Minimalist geometric 'am' representing Ashley Murphy / amrf.dev -->
