<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    :root {
      --accent: #675796;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #B0B3D6;
      }
    }
    .stem {
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
    }
    .bowl {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
    }
  </style>
  <!-- Minimalist geometric 'a' representing Ash / amrf.dev -->
  <circle cx="15.5" cy="17" r="5" class="bowl" />
  <line x1="20.5" y1="12" x2="20.5" y2="22" class="stem" />
</svg>