  <line x1="14" y1="13.5" x2="14" y2="22.5" class="geom-char" />
  
  <!-- Letter 'm' -->
  <path d="M18,22.5 V15.5 A2.5,2.5 0 0,1 23,15.5 V22.5 M23,15.5 A2.5,2.5 0 0,1 28,15.5 V22.5" class="geom-char" />
